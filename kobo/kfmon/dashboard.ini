; KFMon : lance le tableau de bord quand on ouvre l'icône « Panneau Castor » de la bibliothèque.
; À copier dans /mnt/onboard/.adds/kfmon/config/ (un seul [watch] par fichier).
[watch]
; Ces deux clés sont obligatoires (128 caractères maximum chacune)
; filename : l'icône à surveiller. Comme celle de KOReader (koreader.png), on la met à la racine
; de la Kobo, dans un endroit VISIBLE (pas .adds), pour que Nickel l'importe dans la bibliothèque.
filename = /mnt/onboard/panneau.png
; action : le programme lancé quand l'icône est ouverte
action = /mnt/onboard/.adds/dash/dashboard.sh

; Facultatif
label = Panneau Castor
hidden = 0
; Empêche tout autre lancement via KFMon tant que le tableau de bord tourne
block_spawns = 1
; Mettre à 1 écrit dans la base de données de Nickel pour donner un titre à l'entrée
; (« potentiellement risqué », désactivé par défaut). Sinon l'entrée porte le nom du fichier.
do_db_update = 0
; Si do_db_update = 1, les trois clés suivantes sont OBLIGATOIRES
db_title = Panneau Castor
db_author = Tableau de bord
db_comment = Météo, habits, calendrier et nouvelles
