# Configuration du tableau de bord.
#
# Copiez ce fichier vers config.ini (à la racine du projet) puis adaptez-le :
#     cp config.example.ini config.ini
# config.ini n'est PAS versionné (voir .gitignore) : c'est là que vont vos vraies valeurs.
# Les commentaires doivent être sur leur propre ligne (pas en fin de ligne).

[location]
# Position pour la météo (Open-Meteo). Valeurs d'exemple : Montréal.
# Pour votre ville : clic droit sur une carte en ligne, puis copier les coordonnées.
latitude = 45.5017
longitude = -73.5673
# Nom de fuseau horaire IANA (liste : https://en.wikipedia.org/wiki/List_of_tz_database_time_zones)
timezone = America/Toronto

[news]
# Flux RSS de nouvelles en français (Radio-Canada | Nouvelles).
# Laissez vide pour afficher « Nouvelles non configurées ».
feed_url = https://ici.radio-canada.ca/rss/4159
# Nombre de manchettes affichées (selon la place disponible, la dernière peut être tronquée)
headlines = 1

[calendar]
# Adresse iCal (.ics) PRIVÉE de votre calendrier.
#   Google Calendar : Paramètres > votre calendrier > Intégrer le calendrier >
#   « Adresse secrète au format iCal ».
# Traitez cette adresse comme un mot de passe : ne la mettez jamais dans un fichier versionné.
# Laissez vide pour afficher « Calendrier non configuré ».
ics_url =

[display]
# Titre affiché en haut de l'image.
title = Panneau Castor

[sports]
# Équipe de la LNH (abréviation officielle : MTL = Canadiens, TOR = Toronto, etc.).
# S'il y a eu un match la veille, son résultat s'affiche au-dessus des nouvelles.
# Laissez vide pour désactiver.
team = MTL
